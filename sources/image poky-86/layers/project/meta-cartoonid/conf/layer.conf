# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-cartoonid"
BBFILE_PATTERN_meta-cartoonid = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-cartoonid = "6"

LAYERDEPENDS_meta-cartoonid = "core"
LAYERSERIES_COMPAT_meta-cartoonid = "scarthgap"
